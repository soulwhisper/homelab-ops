---
# Defaults that talosctl v1.14 `gen config` emits as dedicated documents but
# our --talos-version v1.13.9 pinned generation omits. Applied so nodes
# upgraded to v1.14.0 match fresh 1.14 installs.
# NOTE: apply only after the node runs Talos >= 1.14.
apiVersion: v1alpha1
kind: FilesystemTrimConfig
interval: 168h0m0s # weekly fstrim; v1.14 default
---
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: true # v1.14 default
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: stable # v1.14 default
