---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# yamllint disable rule:truthy

name: Image-Pull
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Image Pull - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@v0.6.0
        with:
          patterns: kubernetes/**/*

  extract:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Image Pull - Extract
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install flate
        uses: home-operations/flate/action@v0.6.5
        with:
          token: ""

      - name: Extract Images
        id: extract
        env:
          FLATE_OUTPUT: json
          FLATE_PATH: ./kubernetes/flux/cluster
        run: |
          images=$(flate diff images)
          echo "Images to pull:"
          echo "${images}" | yq --prettyPrint
          if [ "${images}" = "[]" ]; then
              images='["__skip__"]'
          fi
          echo 'images<<EOF' >> "${GITHUB_OUTPUT}"
          echo "${images}" >> "${GITHUB_OUTPUT}"
          echo 'EOF' >> "${GITHUB_OUTPUT}"

  check:
    if: ${{ needs.extract.outputs.images != '[]' }}
    needs: extract
    name: Image Pull - Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJSON(needs.extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Install crane
        run: |
          # renovate: datasource=github-releases depName=google/go-containerregistry
          CRANE_VERSION="v0.22.1"
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp crane
          sudo install -m 0755 /tmp/crane /usr/local/bin/crane

      - name: Check Image Exists
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if [ "${IMAGE}" = "__skip__" ]; then
            echo "No new images to check"
            exit 0
          fi
          crane manifest "${IMAGE}" --platform linux/amd64 > /dev/null

  success:
    if: ${{ !cancelled() }}
    needs: check
    name: Image Pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Check job status
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
