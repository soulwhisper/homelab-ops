---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# yamllint disable rule:truthy

name: Workflow-cleanup
permissions:
  actions: write
  contents: read

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  cleanup_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Cleanup workflow stale runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: "${{ steps.app-token.outputs.token }}"
          repository: "${{ github.repository }}"
          retain_days: "0"
          keep_minimum_runs: "0"
          delete_run_by_conclusion_pattern: "cancelled,skipped"
      - name: Cleanup workflow success runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: "${{ steps.app-token.outputs.token }}"
          repository: "${{ github.repository }}"
          retain_days: "7"
          keep_minimum_runs: "3"
          delete_run_by_conclusion_pattern: "success"
      - name: Cleanup workflow failure runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: "${{ steps.app-token.outputs.token }}"
          repository: "${{ github.repository }}"
          # keep failure runs at least 7 days so failed runs remain debuggable
          retain_days: "7"
          keep_minimum_runs: "3"
          delete_run_by_conclusion_pattern: "action_required,failure"
