---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: "${APP}"
spec:
  policyRef:
    name: "${APP}"
  schedule:
    cron: "${KOPIUR_SCHEDULE:-0 */6 * * *}"
    jitter: 30m
    runOnCreate: false
