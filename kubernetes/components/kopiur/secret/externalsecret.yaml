---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Projects the shared ClusterRepository credentials into this namespace:
# kopiur backup movers run in the consumer namespace and read the secret
# by the same name the ClusterRepository references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-repository-secret
    template:
      data:
        # kopia repo password — legacy 1Password field name (encryption_cipher.volsync),
        # reused as the shared cluster repository password
        KOPIA_PASSWORD: "{{ .volsync }}"
        # versitygw (NAS)
        AWS_ACCESS_KEY_ID: "{{ .admin_user }}"
        AWS_SECRET_ACCESS_KEY: "{{ .admin_pass }}"
  dataFrom:
    - extract:
        key: encryption_cipher
    - extract:
        key: app-user
