---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name trendradar
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # agent gateway (omni/micro lanes via LiteLLM openai/ provider)
        AI_API_KEY: "{{ .agentgateway_api_auth }}"
        # ntfy private topic (unguessable name acts as the secret; token optional)
        NTFY_TOPIC: "{{ .ntfy_topic }}"
        NTFY_TOKEN: "{{ .ntfy_token }}"
  dataFrom:
    - extract:
        key: llm-api
    - extract:
        key: trendradar
