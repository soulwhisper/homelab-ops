---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-repository-secret
    template:
      data:
        # kopia repo password — same value volsync used, reused for the
        # shared cluster repository
        KOPIA_PASSWORD: "{{ .volsync }}"
        # versitygw (NAS)
        AWS_ACCESS_KEY_ID: "{{ .admin_user }}"
        AWS_SECRET_ACCESS_KEY: "{{ .admin_pass }}"
  dataFrom:
    - extract:
        key: encryption_cipher
    - extract:
        key: app-user
