---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name kopiur
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kopiur

  values:
    fullnameOverride: *name
    # webhook cert is self-managed by the chart; no cert-manager dependency
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 2000
      runAsGroup: 2000
      fsGroup: 2000
      fsGroupChangePolicy: OnRootMismatch
    monitoring:
      # dashboards are managed as GrafanaDashboard CRs from
      # monitoring-system/grafana/cluster/dashboards/_sources, not chart-rendered
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
