---
# MacStudio inference host (studio.homelab.internal, oMLX OpenAI-compatible).
# Literal IP: cluster DNS resolution of homelab.internal is not guaranteed.
# Qwen3.5-4B is a unified vision-language model (image-text-to-text), so one
# endpoint serves the fast, memory and vision lanes.
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaybackend_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: llm-backend-fast
spec:
  ai:
    provider:
      openai:
        model: "qwen3.5-4b"
      host:  10.10.0.210
      port:  8080
---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/agentgateway.dev/agentgatewaybackend_v1alpha1.json
