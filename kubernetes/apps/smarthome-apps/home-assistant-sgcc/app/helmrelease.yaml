---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name home-assistant-sgcc
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/maribelhearm/sgcc-home-assistant-bridge
              tag: v0.1.8
            envFrom: &envFrom
              - configMapRef:
                  name: *name
              - secretRef:
                  name: *name
            resources: &resources
              requests:
                cpu: 40m
              limits:
                memory: 1Gi
          browser:
            image:
              repository: ghcr.io/maribelhearm/sgcc-home-assistant-bridge-browser
              tag: v0.1.8
            envFrom: *envFrom
            resources: *resources

    persistence:
      app:
        existingClaim: home-assistant
        globalMounts:
          - path: /data
            subPath: sgcc
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
