---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &name woodpecker
  annotations:
    config.home-ops.io/managed: "true"
  labels:
    config.home-ops.io/deps: "infra"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *name
  targetNamespace: worker-apps
  path: "./kubernetes/apps/worker-apps/woodpecker/app"
  postBuild:
    substitute:
      APP: *name
      # chart-managed StatefulSet volumeClaimTemplate PVC (no existingClaim support in woodpecker chart 3.6.5)
      VOLSYNC_CLAIM: data-woodpecker-server-0
