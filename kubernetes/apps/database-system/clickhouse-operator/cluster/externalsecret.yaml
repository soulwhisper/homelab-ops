---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-credentials
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        default_password: "{{ .default_password }}"
        # users.d drop-in for the langfuse user, mounted into the ClickHouse pods
        langfuse.yaml: |
          users:
            langfuse:
              password:
                - '{{ .langfuse_password }}'
              profile: default
              grants:
                - query: "GRANT ALL ON langfuse.*"
  dataFrom:
    - extract:
        key: clickhouse
