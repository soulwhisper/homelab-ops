---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# 1Password item `agent-memory` fields:
#   llm_api_key            — memory group LLM key (memory-core embed/summarize + memory-hub knowledge)
#   proxy_upstream_api_key — proxy group LLM key (upstream for forwarded client requests)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-memory
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # memory-core (env overrides yaml config)
        TDAI_LLM_API_KEY: "{{ .llm_api_key }}"
        # memory-hub
        LLM_API_KEY: "{{ .llm_api_key }}"
        # memory-proxy (expanded into /data/config.yaml upstream.apiKey)
        PROXY_UPSTREAM_API_KEY: "{{ .proxy_upstream_api_key }}"
  dataFrom:
    - extract:
        key: agent-memory
