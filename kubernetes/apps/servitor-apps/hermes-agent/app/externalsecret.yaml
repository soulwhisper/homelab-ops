---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # Gateway
        WEIXIN_ACCOUNT_ID: "{{ .weixin_bot }}"
        WEIXIN_TOKEN: "{{ .weixin_bot }}:{{ .wechat_token }}"
        WEIXIN_BASE_URL: "https://ilinkai.weixin.qq.com"
        WEIXIN_CDN_BASE_URL: "https://novac2c.cdn.weixin.qq.com/c2c"
        WEIXIN_DM_POLICY: "allowlist"
        WEIXIN_ALLOW_ALL_USERS: "false"
        WEIXIN_ALLOWED_USERS: "{{ .weixin_id }}"
        WEIXIN_GROUP_POLICY: "disabled"
        WEIXIN_GROUP_ALLOWED_USERS: ""
        WEIXIN_HOME_CHANNEL: "{{ .weixin_id }}"
        # Web
        FIRECRAWL_API_URL: "http://firecrawl.selfhosted-apps.svc.cluster.local:3002"
        # LLM via agent gateway (consumed by seed-config initContainer)
        OPENAI_BASE_URL: "http://agentgateway-proxy.networking-system.svc.cluster.local:80/chat"
        OPENAI_API_KEY: "{{ .agentgateway_api_auth }}"
        # gateway API server keys (>=16 chars; per-profile keys are scoped)
        API_SERVER_KEY: "{{ .api_server_key }}"
        CHAT_API_SERVER_KEY: "{{ .chat_api_server_key }}"
        # frigate-vision alert route HMAC secret (platforms.webhook, ops profile)
        FRIGATE_WEBHOOK_SECRET: "{{ .frigate_webhook_secret }}"
  dataFrom:
    - extract:
        key: hermes-agent
    - extract:
        key: llm-api
