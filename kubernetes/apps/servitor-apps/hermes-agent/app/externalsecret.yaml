---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # Gateway
        WEIXIN_ACCOUNT_ID: "{{ .weixin_bot }}"
        WEIXIN_TOKEN: "{{ .weixin_bot }}:{{ .wechat_token }}"
        WEIXIN_BASE_URL: "https://ilinkai.weixin.qq.com"
        WEIXIN_CDN_BASE_URL: "https://novac2c.cdn.weixin.qq.com/c2c"
        WEIXIN_DM_POLICY: "allowlist"
        WEIXIN_ALLOW_ALL_USERS: "false"
        WEIXIN_ALLOWED_USERS: "{{ .weixin_id }}"
        WEIXIN_GROUP_POLICY: "disabled"
        WEIXIN_GROUP_ALLOWED_USERS: ""
        WEIXIN_HOME_CHANNEL: "{{ .weixin_id }}"
        # API
        FIRECRAWL_API_URL: "http://firecrawl.selfhosted-apps.svc.cluster.local:3002"
        # Buzz (native platform plugin; requires buzz CLI from hermes-extras)
        # in-cluster base URL; community identity is pinned by the relay's relayUrl (wss://buzz.noirprime.com)
        BUZZ_RELAY_URL: "http://buzz-relay.servitor-apps.svc.cluster.local:3000"
        BUZZ_PRIVATE_KEY: "{{ .agent_private_key }}"
        BUZZ_ALLOW_ALL_USERS: "false"
        BUZZ_ALLOWED_USERS: "{{ .admin_public_key }}"
        BUZZ_REPLY_IN_THREAD: "true"
        # optional: NIP-OA owner attestation for NIP-42 WS auth — add `nip_oa_auth_tag`
        # field to the 1Password `buzz` item first, then uncomment:
        # BUZZ_AUTH_TAG: "{{ .nip_oa_auth_tag }}"
        # set after first join (channel UUID for cron/notification delivery):
        # BUZZ_HOME_CHANNEL: ""
  dataFrom:
    - extract:
        key: hermes-agent
    - extract:
        key: buzz
