---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name buzz-agent
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  values:
    defaultPodOptions:
      runtimeClassName: kata
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/soulwhisper/buzz-agent-omp
              tag: 2026.08.09
            env:
              BUZZ_RELAY_URL: ws://buzz.servitor-apps.svc.cluster.local:3000
              BUZZ_ACP_RESPOND_TO: owner-only
            envFrom:
              - secretRef:
                  name: *name
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    persistence:
      cache:
        type: emptyDir
        globalMounts:
          - path: /home/agent/.omp
            subPath: omp
          - path: /home/agent/.cache
            subPath: cache
          - path: /tmp
            subPath: tmp
