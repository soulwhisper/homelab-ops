---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-agent-egress
spec:
  endpointSelector:
    matchLabels:
      "app.kubernetes.io/name": buzz-agent
  egress:
    # Buzz relay (in-namespace)
    - toServices:
        - k8sService:
            serviceName: buzz
            namespace: servitor-apps
      toPorts:
        - ports:
            - { port: "3000", protocol: TCP }

    # LLM via agentgateway
    - toServices:
        - k8sService:
            serviceName: agentgateway-proxy
            namespace: networking-system
      toPorts:
        - ports:
            - { port: "80", protocol: TCP }
          rules:
            http:
              - method: "POST"
                path: "/chat/.*"

    # DNS
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: TCP }
            - { port: "53", protocol: UDP }
