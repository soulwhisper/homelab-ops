---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name buzz
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        # Relay identity — rotation = identity change. From 1Password item `buzz`.
        # Example values (generated, unused elsewhere — rotate at will):
        #   relay_private_key:    3ffd5fe399876ee2fa3fbfce728de1774480713e2e57a0d01522c264a2eb7601
        #     (pubkey:            6e615b81d12713ec6eda21f3b34e0cd0975185cbaa26687443b410f2196441f1)
        #   git_hook_hmac_secret: 1e6c73ee34cb032b92176ef422b4014e4634d1457015d8d1014c9ad1157ee3ff
        BUZZ_RELAY_PRIVATE_KEY: "{{ .relay_private_key }}"
        BUZZ_GIT_HOOK_HMAC_SECRET: "{{ .git_hook_hmac_secret }}"
        # Shared CNPG cluster; credentials follow components/cnpg convention.
        DATABASE_URL: postgresql://${APP}:${APP}@${CNPG_NAME:=postgres}-rw.database-system.svc.cluster.local:5432/${APP}
        # Per-app Dragonfly (components/dragonfly); no auth, in-cluster only.
        REDIS_URL: redis://${APP}-dragonfly.servitor-apps.svc.cluster.local:6379
  dataFrom:
    - extract:
        key: *name
