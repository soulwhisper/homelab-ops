---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name buzz-agent
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        # Agent identity (its own Nostr keypair, NOT the relay's) and the
        # owner pubkey allowed to drive it. From 1Password item `buzz-agent`.
        BUZZ_PRIVATE_KEY: "{{ .agent_private_key }}"
        BUZZ_ACP_AGENT_OWNER: "{{ .agent_owner_pubkey }}"
        # LLM access for oh-my-pi via the cluster agentgateway LLM proxy.
        OPENAI_BASE_URL: http://agentgateway-proxy.networking-system.svc.cluster.local
        OPENAI_API_KEY: "{{ .openai_api_key }}"
  dataFrom:
    - extract:
        key: *name
