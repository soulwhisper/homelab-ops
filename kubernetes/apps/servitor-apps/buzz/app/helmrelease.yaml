---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name buzz
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: buzz

  values:
    # Public wss:// URL clients dial; also drives media base URL.
    relayUrl: wss://buzz.noirprime.com
    # 64-char lowercase hex Nostr pubkey of the relay operator.
    # EXAMPLE value (keypair generated for this commit) — replace with the
    # operator's real pubkey before exposing the relay publicly.
    ownerPubkey: "8233002e09d8c17b7ea28fc64b321d07aec2784ac2f7e241f918a3191ae2c532"

    replicaCount: 1

    # All sensitive env via the ExternalSecret-managed `buzz` Secret:
    # BUZZ_RELAY_PRIVATE_KEY, BUZZ_GIT_HOOK_HMAC_SECRET, DATABASE_URL, REDIS_URL.
    secrets:
      existingSecret: *name

    # Postgres: shared CNPG cluster via components/cnpg (buzz-pguser).
    # Redis/Valkey: per-app Dragonfly via components/dragonfly (buzz-dragonfly).
    # S3: Ceph RGW via components/ceph-bucket (ceph-bucket-buzz OBC).
    s3:
      # Chart 0.1.7 has no s3.addressingStyle key; the relay defaults to
      # path-style, which is what Ceph RGW expects.
      endpoint: http://rook-ceph-rgw-ceph-objectstore.storage-system.svc.cluster.local
      bucket: *name

    # Git state is object-store-backed (S3 pointer CAS + Postgres repo names);
    # the on-disk repo path is pure scratch -> per-pod emptyDir, no PVC,
    # nothing for volsync to back up here.
    persistence:
      git:
        enabled: false
        size: 10Gi

    # Create the buzz database/user on the shared CNPG cluster before start.
    extraInitContainers:
      - name: init-db
        image: ghcr.io/home-operations/postgres-init:18
        envFrom:
          - secretRef:
              name: buzz-initdb
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    relay:
      extraEnv:
        # Ceph RGW bucket credentials minted by the ObjectBucketClaim.
        - name: BUZZ_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: ceph-bucket-buzz
              key: AWS_ACCESS_KEY_ID
        - name: BUZZ_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ceph-bucket-buzz
              key: AWS_SECRET_ACCESS_KEY

    serviceMonitor:
      enabled: true
