---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name buzz-agent
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: gitops-system

  # buzz-acp harness (block/buzz sprig base) spawning `omp acp` as the
  # ACP agent runtime. Requires the custom image below — see app/Dockerfile.
  values:
    defaultPodOptions:
      runtimeClassName: kata
    controllers:
      *name :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # sprig 'agent' user
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/soulwhisper/buzz-sprig-omp
              tag: "2026.8.5"
            env:
              # In-cluster relay endpoint; NIP-42 auth still enforced.
              BUZZ_RELAY_URL: ws://buzz.servitor-apps.svc.cluster.local:3000
              # Agent runtime: oh-my-pi in ACP stdio server mode.
              BUZZ_ACP_AGENT_COMMAND: omp
              BUZZ_ACP_AGENT_ARGS: acp
              BUZZ_ACP_RESPOND_TO: owner-only
              BUZZ_ACP_SESSION_TITLE: oh-my-pi
            envFrom:
              - secretRef:
                  name: *name
            probes:
              startup: &disabled
                enabled: false
              liveness: *disabled
              readiness: *disabled
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    persistence:
      app:
        existingClaim: buzz # volsync-backed PVC from components/volsync
        globalMounts:
          - path: /home/agent/.omp
            subPath: omp
          - path: /workspace
            subPath: workspace
      cache:
        type: emptyDir
        globalMounts:
          - path: /home/agent/.cache
      tmpfs:
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        globalMounts:
          - path: /tmp
