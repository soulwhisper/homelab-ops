---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name mcp-firecrawl
spec:
  groupRef:
    name: external
  image: ghcr.io/firecrawl/firecrawl-mcp-server:latest@sha256:82b5430172103912673a6e62761cbad3f8c8c8b6a13a2db84bfc38c1a3a923c6
  env:
    - name: PORT
      value: "3000"
    - name: FIRECRAWL_API_URL
      value: "http://firecrawl.selfhosted-apps.svc.cluster.local:3002"
    - name: HTTP_STREAMABLE_SERVER
      value: "true"
  mcpPort: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
