---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
# Long-lived OAuth material for the Dropbox app (scoped access). The short-lived
# access token is derived by the token-refresher CronJob — never stored here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dropbox-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # Dropbox App Console -> app (scoped access, full dropbox,
        # files.* read/write + sharing + file_requests scopes)
        client_id: "{{ .dropbox_app_key }}"
        client_secret: "{{ .dropbox_app_secret }}"
        # one-time: oauth2 authorize with token_access_type=offline, then
        # exchange the code for this refresh token
        refresh_token: "{{ .dropbox_refresh_token }}"
  dataFrom:
    - extract:
        key: dropbox
