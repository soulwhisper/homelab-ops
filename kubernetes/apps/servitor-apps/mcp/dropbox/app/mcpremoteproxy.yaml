---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/toolhive.stacklok.dev/mcpremoteproxy_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: dropbox
spec:
  groupRef:
    name: external
  remoteUrl: https://mcp.dropbox.com/mcp
  proxyPort: 8080
  transport: streamable-http
  # upstream auth: Bearer access token injected from the refreshed secret
  # (token-refresher CronJob keeps dropbox-mcp-token current; tokens live ~4h)
  headerForward:
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: dropbox-mcp-token
          key: authorization
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
