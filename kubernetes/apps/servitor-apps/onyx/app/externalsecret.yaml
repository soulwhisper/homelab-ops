---
# yaml-language-server: $schema=https://soulwhisper.github.io/k8s-schemas/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name onyx
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        # openssl rand -hex 32
        USER_AUTH_SECRET: "{{ .user_auth_secret }}"
        # must meet OpenSearch complexity: >=8 chars, upper+lower+digit+special
        OPENSEARCH_ADMIN_USERNAME: "admin"
        OPENSEARCH_ADMIN_PASSWORD: "{{ .opensearch_admin_password }}"
        # Craft sandbox push auth; Ed25519 private key, base64 raw. Generate:
        # python3 -c "import base64; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey as K; from cryptography.hazmat.primitives.serialization import *; print(base64.b64encode(K.generate().private_bytes(Encoding.Raw,PrivateFormat.Raw,NoEncryption())).decode())"
        ONYX_SANDBOX_PUSH_PRIVATE_KEY: "{{ .sandbox_push_private_key }}"
  dataFrom:
    - extract:
        key: *name
