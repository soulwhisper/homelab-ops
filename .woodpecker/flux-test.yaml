---
# Woodpecker port of .github/workflows/flux-checks.yaml (job: test).
# Kept alongside the GitHub workflow for the forgejo+woodpecker migration;
# GitHub Actions remains authoritative until cutover.
# Prerequisites:
#   - woodpecker repo secret `forgejo_token` (issues:write on the forgejo repo)
when:
  - event: pull_request
    path: ["kubernetes/**"]

steps:
  - name: flate test + diff
    image: alpine:3.22
    environment:
      FLATE_PATH: ./kubernetes/flux/cluster
      FLATE_SOURCE_RETRY_MAX_WAIT: 30s
    commands:
      - apk add --no-cache curl git jq > /dev/null
      - curl -fsSL https://mise.run | sh > /dev/null
      - export PATH="${HOME}/.local/bin:${PATH}"
      - mise install --yes
      - mise exec -- flate test all --base "origin/${CI_COMMIT_TARGET_BRANCH}"
      - mise exec -- flate diff all > flate-diff.out || true

  - name: sticky PR comment
    image: alpine:3.22
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - apk add --no-cache curl jq > /dev/null
      - |
        if [ ! -s flate-diff.out ]; then
          echo "No diff, skipping comment"
          exit 0
        fi
        DIFF_RAW=$(head -c 60000 flate-diff.out)
        if [ "$(wc -c < flate-diff.out)" -gt 60000 ]; then
          DIFF_RAW=$(printf '%s\n' "${DIFF_RAW}" | sed '$d')
          DIFF_RAW="${DIFF_RAW}
        ... (truncated)"
        fi
        API="${CI_FORGE_URL}/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/issues/${CI_COMMIT_PULL_REQUEST}/comments"
        BODY=$(jq -n --arg diff "${DIFF_RAW}" '{body: ("<!-- flate-diff -->\n```diff\n" + $diff + "\n```")}')
        COMMENT_ID=$(curl -fsSL -H "Authorization: token ${FORGEJO_TOKEN}" "${API}?limit=100" \
          | jq -r '[.[] | select(.body | startswith("<!-- flate-diff -->"))] | .[0].id // empty')
        if [ -n "${COMMENT_ID}" ]; then
          curl -fsSL -X PATCH -H "Authorization: token ${FORGEJO_TOKEN}" -H "Content-Type: application/json" \
            -d "${BODY}" "${CI_FORGE_URL}/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/issues/comments/${COMMENT_ID}" > /dev/null
        else
          curl -fsSL -X POST -H "Authorization: token ${FORGEJO_TOKEN}" -H "Content-Type: application/json" \
            -d "${BODY}" "${API}" > /dev/null
        fi
